name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: packaging layout
        run: ./packaging/check.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JS deps
        run: npm ci
      - name: Python deps
        run: |
          python3 -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt -r tests/requirements.txt
          backend/.venv/bin/python -m playwright install chromium
      - name: lint and tests
        run: ./start.sh test --yes
