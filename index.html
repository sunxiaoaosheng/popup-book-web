<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>林间小屋 · 立体翻翻书</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#241c17;color:#f6ead2;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;}
  #stage{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  /* 暗角 */
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);}
  #caption{position:fixed;left:50%;top:16px;transform:translateX(-50%);padding:6px 16px;border-radius:999px;
    background:rgba(30,22,16,.55);backdrop-filter:blur(6px);font-size:14px;letter-spacing:.08em;white-space:nowrap;
    transition:opacity .4s;}
  #hud{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(680px,92vw);
    background:rgba(30,22,16,.72);backdrop-filter:blur(8px);border-radius:14px;padding:10px 16px 12px;
    box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:13px;}
  #hud .row{display:flex;align-items:center;gap:12px;}
  #hud input[type=range]{flex:1;accent-color:#f2a24a;height:24px;}
  #hud input[type=range]:disabled{opacity:.45}
  #angle{font-variant-numeric:tabular-nums;font-size:22px;min-width:84px;text-align:right;color:#ffd48a}
  #src{display:flex;align-items:center;gap:6px;margin-top:6px;opacity:.9;justify-content:space-between;flex-wrap:wrap}
  #dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#8a7f74;margin-right:6px}
  #dot.on{background:#6be28a;box-shadow:0 0 8px #6be28a}
  button{background:#f2a24a;color:#2a1a0e;border:0;border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
  button.ghost{background:transparent;color:#f6ead2;border:1px solid rgba(255,255,255,.3)}
  #hint{position:fixed;right:12px;top:12px;font-size:12px;opacity:.55}
  body.nohud #hud,body.nohud #caption,body.nohud #hint{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="caption">合上的书 · 一道暖光从缝里漏出来</div>
<div id="hint">H 隐藏/显示面板</div>
<div id="hud">
  <div class="row">
    <span>0°</span>
    <input id="slider" type="range" min="0" max="130" step="0.1" value="0">
    <span>130°</span>
    <span id="angle">0.0°</span>
  </div>
  <div id="src">
    <span><span id="dot"></span><span id="srcText">模拟模式（拖动滑块）</span></span>
    <span>
      <button id="auto" class="ghost">▶ 自动演示</button>
    </span>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
